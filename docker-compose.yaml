services:
  generator:
    build: .
    volumes:
      - ./generated:/mnt/import
  peopleapi:
    image: eu.gcr.io/vseth-public/dev-setup
    privileged: true
    profiles: [dev-setup]
    depends_on:
      generator:
        condition: service_completed_successfully
    volumes:
      - ./generated:/data
    ports:
      - 8080:8080
